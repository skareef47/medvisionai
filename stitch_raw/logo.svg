  <!-- Brand Typography -->
  <text x="68" y="34" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="24" fill="#090d16" letter-spacing="-0.5">MedVision<tspan fill="#1a56db">.AI</tspan></text>
