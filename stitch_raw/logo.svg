  <line x1="42" y1="32" x2="48" y2="32" stroke="#ffffff" stroke-width="3" stroke-linecap="square"/>
  <!-- Corner optical brackets -->
  <path d="M12 18 V12 H18" stroke="#ffffff" stroke-width="2.5"/>
