  <circle cx="28" cy="32" r="6" fill="#00b4d8" stroke="#ffffff" stroke-width="2"/>
  <!-- Reticle ticks -->
  <line x1="28" y1="12" x2="28" y2="18" stroke="#ffffff" stroke-width="3" stroke-linecap="square"/>
